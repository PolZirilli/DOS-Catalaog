<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ScummVM</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #status {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    color: #6f6; font: 12px monospace; z-index: 3; white-space: pre-wrap;
  }
  #status.error { color: #f66; }
  canvas.emscripten {
    border: 0 none; background: #000;
    position: absolute; top: 0; left: 0; margin: 0;
    width: 100%; height: 100%; display: block; outline: none;
  }
</style>
</head>
<body>
<div id="status">Cargando ScummVM…</div>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

<!--
  Este archivo va DENTRO de la misma carpeta donde vendorizás el build de la
  GitHub Action (js/vendor/scummvm/), junto a scummvm.js, scummvm.wasm y
  data/. Es así a propósito: el propio scummvm.wasm hace fetch() de rutas
  relativas como "data/gui-icons.dat", y esas rutas se resuelven contra la
  URL de ESTA página, no contra el script. Por eso DOSVault no inyecta
  scummvm.js directo en su DOM: abre esta página en un <iframe> (ver
  js/scummvm-engine.js), así todas las rutas relativas caen en el lugar
  correcto sin importar en qué carpeta esté el resto del sitio.

  El juego a cargar se pasa por query string: launcher.html?bundle=<url>
  El bundle es un .zip con los archivos de datos crudos del juego (no un
  .jsdos). Se descarga, se descomprime en el navegador con fflate, se elige
  automáticamente la carpeta que contiene el juego (ver
  pickGameFolderAndFlatten más abajo — muchos zips de abandonware traen el
  juego adentro de "C/<CARPETA>/", junto con partidas guardadas, extras, o
  hasta un ScummVM portable de Windows sueltos al lado) y se monta en /game
  antes de arrancar ScummVM, que se auto-lanza directo a ese juego vía el
  argumento --path=/game (pasado por el hash de la URL, que es como este
  build en particular lee Module["arguments"] — lo pisa si no viene por ahí,
  así que NO alcanza con setear Module.arguments en JS).

  IMPORTANTE: --auto-detect NO admite --recursive (ScummVM tira error si se
  usan juntos), por eso hace falta dejar los archivos del juego sueltos
  directo en la raíz de /game en vez de confiar en una búsqueda recursiva.

  PLUGINS DE MOTOR: a diferencia de "data/gui-icons.dat" y otros assets
  sueltos (que sí resuelve solo vía fetch relativo), los plugins de motor
  (data/plugins/*.so — libscumm.so, libsci.so, etc.) los busca ScummVM
  DIRECTO en su filesystem virtual (vía dlopen) sin ir a la red primero; si
  no están ahí ya montados, tira "Could not find suitable engine plugin"
  aunque el juego se haya detectado bien. Por eso acá abajo se bajan TODOS
  los .so listados en data/plugins/index.json de antemano y se escriben en
  el filesystem virtual en un par de rutas candidatas (no hay forma de saber
  desde JS cuál usa el buscador interno sin decompilar el .wasm).
-->
<script src="fflate.min.js"></script>
<script>
// Todo envuelto en un IIFE a propósito: este <script> comparte el scope
// global de la página con scummvm.js, que se inyecta después. scummvm.js
// tiene código interno viejo que usa variables sin declarar (ej. "params=..."
// sin var/let/const) — si nosotros también declarábamos algo con ese mismo
// nombre en el scope global (aunque sea "const params"), scummvm.js terminaba
// reasignando NUESTRA constante y tirando "Assignment to constant variable".
// Aislando todo acá adentro evitamos pisarnos con cualquier nombre interno
// que use scummvm.js, no solo "params".
(function () {
  const statusEl = document.getElementById('status');
  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }

  const dvParams = new URLSearchParams(window.location.search);
  const bundleUrl = dvParams.get('bundle');

  // Carpetas que suelen viajar al lado de la carpeta real del juego en
  // packs de abandonware, y que nunca son el juego en sí.
  const JUNK_DIR_NAMES = new Set(['saves', 'save', 'extras', 'extra', 'manual', 'manuals', 'docs', 'scummvm', 'dosbox']);

  function pickGameFolderAndFlatten(rawEntries) {
    const files = {};
    Object.keys(rawEntries).forEach(path => {
      if (path.endsWith('/')) return;
      if (path.indexOf('__MACOSX/') !== -1) return;
      const base = path.split('/').pop();
      if (base.startsWith('._') || base === '.DS_Store') return;
      files[path] = rawEntries[path];
    });
    const groups = {};
    Object.keys(files).forEach(path => {
      const slash = path.lastIndexOf('/');
      const dir = slash === -1 ? '' : path.slice(0, slash);
      (groups[dir] = groups[dir] || []).push(path);
    });
    let bestDir = null, bestCount = -1;
    Object.keys(groups).forEach(dir => {
      const lastSeg = dir.split('/').pop().toLowerCase();
      if (JUNK_DIR_NAMES.has(lastSeg)) return;
      if (groups[dir].length > bestCount) { bestCount = groups[dir].length; bestDir = dir; }
    });
    if (bestDir === null) return files;
    const prefix = bestDir === '' ? '' : bestDir + '/';
    const result = {};
    groups[bestDir].forEach(path => { result[path.slice(prefix.length)] = files[path]; });
    return result;
  }

  function fetchBytes(url) {
    return fetch(url).then(resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' en ' + url);
      return resp.arrayBuffer();
    }).then(buf => new Uint8Array(buf));
  }

  // Baja todos los plugins de motor listados en data/plugins/index.json.
  // Si ese índice no existe o falla, sigue sin plugins (algún engine
  // estático podría igual andar) en vez de bloquear todo.
  function fetchAllPlugins() {
    return fetch('data/plugins/index.json')
      .then(r => (r.ok ? r.json() : {}))
      .catch(() => ({}))
      .then(index => {
        const names = Object.keys(index || {});
        return Promise.all(
          names.map(name =>
            fetchBytes('data/plugins/' + name)
              .then(bytes => ({ name, bytes }))
              .catch(err => { console.warn('[scummvm] no se pudo bajar plugin', name, err); return null; })
          )
        ).then(results => results.filter(Boolean));
      });
  }

  if (!bundleUrl) {
    setStatus('Falta el parámetro ?bundle=<url> en la URL.', true);
  } else {
    // Argumentos de arranque de ScummVM: scummvm.js lee esto de
    // window.location.hash al ejecutarse (ver nota arriba), por eso se
    // setea ANTES de inyectar el <script src="scummvm.js">.
    window.location.hash = encodeURI('--auto-detect --path=/game');

    setStatus('Descargando datos del juego…');

    Promise.all([
      fetchBytes(bundleUrl).then(bytes => fflate.unzipSync(bytes)),
      fetchAllPlugins(),
    ])
      .then(([rawEntries, plugins]) => {
        const entries = pickGameFolderAndFlatten(rawEntries);

        window.Module = {
          preRun: [
            function () {
              const FS = Module.FS;

              FS.mkdir('/game');
              Object.keys(entries).forEach(path => {
                if (path.endsWith('/')) return;
                const parts = path.split('/');
                let dir = '/game';
                for (let i = 0; i < parts.length - 1; i++) {
                  dir += '/' + parts[i];
                  try { FS.mkdir(dir); } catch (e) { /* ya existe */ }
                }
                FS.writeFile('/game/' + path, entries[path]);
              });

              // Plugins de motor: se escriben en varias rutas candidatas
              // porque no hay forma de confirmar desde JS cuál usa
              // internamente el buscador de dlopen de este build.
              try { FS.mkdir('/plugins'); } catch (e) { /* ya existe */ }
              plugins.forEach(({ name, bytes }) => {
                try { FS.writeFile('/' + name, bytes); } catch (e) { console.warn('[scummvm] no se pudo escribir', name, 'en /', e); }
                try { FS.writeFile('/plugins/' + name, bytes); } catch (e) { console.warn('[scummvm] no se pudo escribir', name, 'en /plugins/', e); }
              });
            },
          ],
          canvas: document.getElementById('canvas'),
          print: (...args) => console.log('[scummvm]', ...args),
          printErr: (...args) => console.error('[scummvm]', ...args),
          setStatus: (msg) => { if (msg) setStatus(msg); else statusEl.style.display = 'none'; },
          totalDependencies: 0,
          monitorRunDependencies: function (left) {
            this.totalDependencies = Math.max(this.totalDependencies, left);
            setStatus(left ? `Preparando... (${this.totalDependencies - left}/${this.totalDependencies})` : 'Iniciando...');
          },
        };

        window.onerror = function () {
          setStatus('Ocurrió un error, ver la consola del navegador.', true);
        };

        const s = document.createElement('script');
        s.src = 'scummvm.js';
        s.async = true;
        document.body.appendChild(s);
      })
      .catch(err => {
        console.error(err);
        setStatus('No se pudo iniciar el juego: ' + err.message, true);
      });
  }
})();
</script>
</body>
</html>
